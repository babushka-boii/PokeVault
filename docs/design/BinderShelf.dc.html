<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis carpetas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Silkscreen&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FD0E0}a:hover{color:#8BE6F0}
.pv-binder{transition:transform 200ms ease-out, box-shadow 200ms ease-out}
.pv-binder:hover,.pv-binder:focus-visible{transform:translateY(-6px) rotate(-1deg);box-shadow:0 24px 44px rgba(0,0,0,.6)}
@media (prefers-reduced-motion: reduce){.pv-binder{transition:none}.pv-binder:hover,.pv-binder:focus-visible{transform:none}}
</style>
</helmet>
<div style="width: 1280px; height: 820px; box-sizing: border-box; background: #0B0D10; color: #F2F5F7; font-family: Inter, system-ui, sans-serif; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-family: Silkscreen, monospace; font-size: 11px; color: #3FD0E0; letter-spacing: 0.1em">MI COLECCIÓN</div>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700">Mis carpetas</h1>
    </div>
    <div style="display: flex; gap: 10px">
      <a href="#" style="min-height: 44px; display: flex; align-items: center; padding: 0 14px; background: #1B2128; border: 1px solid #5A4A1E; color: #F2C94C; text-decoration: none; font-size: 14px">3 cartas sin carpeta · guardar</a>
      <button type="button" style="min-height: 44px; padding: 0 18px; border: 0; background: #3FD0E0; color: #0B0D10; font: 600 14px Inter, sans-serif; clip-path: polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)">+ Nueva carpeta</button>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end">
    <div style="display: flex; align-items: flex-end; gap: 36px; padding: 0 24px">
      <sc-for list="{{ binders }}" as="b" hint-placeholder-count="4">
        <a href="#" class="pv-binder" style="text-decoration: none; color: #F2F5F7; display: flex; flex-direction: column; gap: 12px; width: 220px">
          <div style="position: relative; height: 290px; border-radius: 6px 12px 12px 6px; background: {{ b.cover }}; box-shadow: inset 14px 0 0 rgba(0,0,0,0.35), 0 14px 30px rgba(0,0,0,0.5); overflow: hidden; border: 1px solid #2A323C">
            <div aria-hidden="true" style="position: absolute; left: 14px; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,0.08)"></div>
            <div aria-hidden="true" style="position: absolute; inset: 10px 10px 10px 24px; border: {{ b.stitch }}; border-radius: 4px"></div>
            <sc-for list="{{ b.stickers }}" as="s" hint-placeholder-count="2">
              <div aria-hidden="true" style="position: absolute; left: {{ s.x }}; top: {{ s.y }}; transform: rotate({{ s.r }}); width: {{ s.size }}; height: {{ s.size }}; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5))">
                <svg width="100%" height="100%" viewBox="0 0 10 10" shape-rendering="crispEdges" fill="{{ s.color }}"><path d="{{ s.path }}"></path></svg>
              </div>
            </sc-for>
            <div style="position: absolute; left: 30px; right: 14px; bottom: 16px; background: rgba(11,13,16,0.78); padding: 8px 10px">
              <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px">{{ b.name }}</div>
              <div style="font-size: 12px; color: #9AA6B2">{{ b.meta }}</div>
            </div>
          </div>
          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #F2C94C; font-size: 14px">{{ b.value }}</div>
        </a>
      </sc-for>
      <button type="button" aria-label="Nueva carpeta" style="width: 160px; height: 290px; border: 2px dashed #3A4652; background: transparent; color: #9AA6B2; font: 600 14px Inter, sans-serif; border-radius: 6px 12px 12px 6px; align-self: flex-start">+ Nueva</button>
    </div>
    <div aria-hidden="true" style="height: 18px; margin-top: 8px; background: linear-gradient(#2A2018, #1A140F); box-shadow: 0 12px 24px rgba(0,0,0,0.6)"></div>
  </div>

  <div style="display: flex; gap: 12px; align-items: center; font-size: 13px; color: #9AA6B2">
    <span style="font-family: Silkscreen, monospace; font-size: 11px; letter-spacing: 0.1em">AUTOMÁTICAS</span>
    <a href="#" style="padding: 8px 12px; border: 1px solid #2A323C; background: #14181D; color: #F2F5F7; text-decoration: none">★ Favoritas</a>
    <a href="#" style="padding: 8px 12px; border: 1px solid #2A323C; background: #14181D; color: #F2F5F7; text-decoration: none">Por expansión</a>
    <span>Se arman solas, con los espacios que te faltan.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const STAR = 'M4 0h2v3h4v2l-3 2 1 3-3-2-3 2 1-3-3-2V3h4z';
    const BOLT = 'M5 0h3L6 4h3L3 10l1-5H1z';
    const HEART = 'M1 1h3v1h2V1h3v4L5 9 1 5z';
    const BLOB = 'M3 1h4v1h1v1h1v3H8v1H7v2H6V7H4v2H3V7H2V6H1V3h1V2h1z';
    return {
      binders: [
        { name: 'Tesoros', meta: '7 cartas · 1 página', value: '$1.116 CLP', cover: 'linear-gradient(150deg,#1B2E3A,#0F1A22)', stitch: '1px dashed rgba(63,208,224,0.45)',
          stickers: [ { path: STAR, color: '#F2C94C', x: '58%', y: '12%', r: '12deg', size: '54px' }, { path: BLOB, color: '#E8C35A', x: '20%', y: '30%', r: '-8deg', size: '64px' } ] },
        { name: 'Repetidas', meta: '0 cartas', value: '$0 CLP', cover: 'linear-gradient(150deg,#3A2418,#21140D)', stitch: '1px dashed rgba(242,201,76,0.4)',
          stickers: [ { path: BOLT, color: '#F2C94C', x: '60%', y: '18%', r: '-10deg', size: '48px' } ] },
        { name: 'Holo', meta: 'Carpeta nueva', value: '$0 CLP', cover: 'conic-gradient(from 210deg at 70% 30%, #2B3E52, #4A3C6A, #2E5F4F, #3A4A2A, #2B3E52)', stitch: '1px solid rgba(255,255,255,0.18)',
          stickers: [ { path: HEART, color: '#E05C9E', x: '22%', y: '16%', r: '6deg', size: '44px' }, { path: STAR, color: '#F2F5F7', x: '62%', y: '40%', r: '-14deg', size: '36px' } ] }
      ]
    };
  }
}
</script>
</body>
</html>
